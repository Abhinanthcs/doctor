<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Healthcare Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center mx-4">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
            <i class="fa-solid fa-heart-pulse text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Welcome to MediCare</h1>
        <p class="text-gray-500 mb-6">Choose a portal to get started</p>
        
        <div class="space-y-3">
            <a href="{{ url_for('doctor_dashboard') }}" class="flex items-center justify-between p-4 border border-blue-200 rounded-xl hover:bg-blue-50 transition text-blue-700 font-medium">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-user-doctor text-xl"></i>
                    Doctor Portal
                </span>
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </a>
            
            <a href="{{ url_for('patient_dashboard') }}" class="flex items-center justify-between p-4 border border-gray-200 rounded-xl hover:bg-gray-50 transition text-gray-700 font-medium">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-hospital-user text-xl text-gray-500"></i>
                    Patient Portal
                </span>
                <i class="fa-solid fa-chevron-right text-sm text-gray-400"></i>
            </a>
        </div>
    </div>
</body>
</html>
